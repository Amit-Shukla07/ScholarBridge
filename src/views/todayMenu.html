<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Mess Menu Dashboard • ScholarBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #080808;
      --card-elevated: #111111;
      --border: #222222;
      --border-light: #2e2e2e;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --text-dim: #555555;

      /* Vibrant Accent Colors matching portal design */
      --pink: #FF2E93;
      --pink-glow: rgba(255, 46, 147, 0.25);
      --pink-subtle: rgba(255, 46, 147, 0.1);

      /* Special item highlights */
      --gold: #FFD700;
      --gold-glow: rgba(255, 215, 0, 0.2);
      --cyan: #00E5FF;
      --cyan-glow: rgba(0, 229, 255, 0.2);

      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --red-nonveg: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Branding & Controls */
    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      margin-bottom: 8px;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--pink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tag::before,
    .brand-tag::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 1px;
      background-color: var(--pink);
      opacity: 0.5;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .live-clock-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-elevated);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Primary Toggle Pill Button */
    .toggle-container {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    .pill-btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 9999px;
      padding: 10px 26px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .pill-btn:hover {
      border-color: #ffffff;
      background: #0d0d0d;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.15), 0 0 30px var(--pink-subtle);
      transform: translateY(-1px);
    }

    .pill-btn.active {
      border-color: var(--pink);
      color: var(--pink);
      box-shadow: 0 0 16px var(--pink-glow);
    }

    /* Day Navigation Tabs */
    .day-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: none;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .day-tabs::-webkit-scrollbar {
      display: none;
    }

    .day-tab {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .day-tab:hover {
      background: var(--card-elevated);
      color: var(--text);
      border-color: var(--border-light);
    }

    .day-tab.active {
      background: #181818;
      color: #ffffff;
      border-color: #555555;
      font-weight: 700;
    }

    .day-tab.today-indicator::after {
      content: 'TODAY';
      font-size: 9px;
      padding: 2px 5px;
      background: var(--pink);
      color: #ffffff;
      border-radius: 4px;
      font-weight: 800;
    }

    /* Main Menu Card */
    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .menu-card:hover {
      border-color: #333333;
    }

    .card-header {
      padding: 24px 28px;
      background: #050505;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-header-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .today-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 8px;
      background: var(--pink);
      color: #ffffff;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .now-serving-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      background: var(--green-glow);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 5px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Dining Table */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead th {
      padding: 16px 28px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      background: #080808;
    }

    th.col-meal {
      width: 220px;
    }

    th.col-timing {
      width: 200px;
    }

    tbody tr {
      border-bottom: 1px solid #161616;
      transition: background-color 0.15s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    tbody tr.active-slot {
      background-color: rgba(255, 46, 147, 0.03);
    }

    tbody td {
      padding: 22px 28px;
      vertical-align: middle;
      font-size: 14px;
    }

    /* Vibrant Pink Meal Tag */
    .meal-tag-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meal-name {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--pink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meal-tag-pill {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--pink);
      box-shadow: 0 0 6px var(--pink);
    }

    .slot-timing-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Items Container */
    .items-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      line-height: 1.6;
    }

    .food-item {
      color: #e4e4e7;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .food-item-separator {
      color: #333333;
      user-select: none;
    }

    /* Special Highlights matching design */
    .food-item.highlight-watermelon {
      color: var(--gold) !important;
      font-weight: 700;
      background: var(--gold-glow);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .food-item.highlight-icecream {
      color: var(--cyan) !important;
      font-weight: 700;
      background: var(--cyan-glow);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 229, 255, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    .food-item.highlight-dessert {
      color: #ffd166 !important;
      font-weight: 600;
      background: rgba(255, 209, 102, 0.1);
      padding: 1px 7px;
      border-radius: 5px;
      border: 1px solid rgba(255, 209, 102, 0.25);
    }

    .food-item.non-veg-item {
      position: relative;
    }

    .non-veg-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      color: var(--red-nonveg);
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* Timing column badge */
    .timing-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: #cccccc;
      background: #111111;
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* Footer info */
    .dashboard-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 8px;
      color: var(--text-dim);
      font-size: 12px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-links {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      border-color: #555555;
      color: #ffffff;
      background: #141414;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 24px 12px 60px 12px;
      }
      .card-header {
        padding: 18px 20px;
      }
      tbody td {
        padding: 18px 20px;
      }
      th.col-timing, td.col-timing {
        display: none;
      }
      .day-tabs {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Top Branding & Navigation -->
    <header class="top-bar">
      <div class="brand-tag">ScholarBridge • SRM University-AP</div>
      <h1 class="page-title">Hostel Dining Dashboard</h1>
      <div class="live-clock-badge">
        <span class="pulse-dot"></span>
        <span id="liveTime">Loading time...</span>
        <span>•</span>
        <span id="currentMealStatus">Determining active meal...</span>
      </div>

      <!-- Prominent Pill Toggle Button -->
      <div class="toggle-container">
        <button class="pill-btn active" id="toggleModeBtn" onclick="toggleViewMode()">
          <span>[ SHOW TODAY'S MENU ONLY ]</span>
        </button>
      </div>
    </header>

    <!-- Day Navigation Bar (Visible in weekly view or for manual preview) -->
    <nav class="day-tabs" id="dayTabsContainer" style="display: none;">
      <button class="day-tab" onclick="selectDay('Monday')">Monday</button>
      <button class="day-tab" onclick="selectDay('Tuesday')">Tuesday</button>
      <button class="day-tab" onclick="selectDay('Wednesday')">Wednesday</button>
      <button class="day-tab" onclick="selectDay('Thursday')">Thursday</button>
      <button class="day-tab" onclick="selectDay('Friday')">Friday</button>
      <button class="day-tab" onclick="selectDay('Saturday')">Saturday</button>
      <button class="day-tab" onclick="selectDay('Sunday')">Sunday</button>
    </nav>

    <!-- Main Dining Menu Card -->
    <main class="menu-card" id="menuCard">
      <div class="card-header">
        <div class="card-header-title">
          <span id="cardHeaderTitle">📅 MONDAY (TODAY)</span>
          <span class="today-badge" id="cardTodayBadge">TODAY</span>
        </div>
        <div class="now-serving-badge" id="nowServingBanner">
          <span class="pulse-dot"></span>
          <span id="nowServingText">Active Service</span>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="col-meal">🕒 MEAL</th>
              <th>🍴 ITEMS</th>
              <th class="col-timing">⏰ TIMINGS</th>
            </tr>
          </thead>
          <tbody id="menuTableBody">
            <!-- Dynamically Rendered -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- Footer with Legend and Quick Actions -->
    <footer class="dashboard-footer">
      <div class="legend">
        <div class="legend-item">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--pink);"></span>
          <span>Official Mess Schedule</span>
        </div>
        <div class="legend-item">
          <span style="color:var(--gold);">🍉 Special Fruit</span>
        </div>
        <div class="legend-item">
          <span style="color:var(--cyan);">🍨 Dessert Special</span>
        </div>
        <div class="legend-item">
          <span class="non-veg-badge">NV</span>
          <span>Non-Veg Available</span>
        </div>
      </div>
      <div class="action-links">
        <button class="action-btn" onclick="copyMarkdown()">📋 Copy as Markdown</button>
        <button class="action-btn" onclick="window.print()">🖨️ Print</button>
      </div>
    </footer>

  </div>

        dinner: {
          timing: MESS_TIMINGS.dinner,
          items: ["Methi Chaman (Veg)", "Egg Curry (SI)", "Veg Sambhar", "Steam Rice", "Curry Leaf Rice (SI)", "Phulka", "Curd", "Rice papad", "Fresh chutney", "Buttermilk", "Banana"],
          nonVeg: ["Egg Curry (SI)"]
        }
      },
      "Sunday": {
        day: "Sunday",
        breakfast: {
          timing: MESS_TIMINGS.weekendBreakfast,
          items: ["Onion Uttapam", "Mysore Bonda", "Sambar", "Groundnut chutney", "Whole wheat bread", "Butter/Jam", "Banana", "Boiled Egg", "Tea/Coffee/Milk"],
          nonVeg: ["Boiled Egg"]
        },
        lunch: {
          timing: MESS_TIMINGS.lunch,
          items: ["Veg Paneer Biryani", "Hyderabadi Murgh Dum Biryani", "Mirchi Ka Salan", "Veg Raita", "Pickle", "Onion & Lemon Salad", "Lemonade", "Beetroot Poriyal", "Mix Dal Fry (SI)", "Steam Rice", "Ice Cream"],
          nonVeg: ["Hyderabadi Murgh Dum Biryani"]
        },
        snacks: {
          timing: MESS_TIMINGS.snacks,
          items: ["Eggless Muffin", "Tea/Coffee/Milk"]
        },
        dinner: {
          timing: MESS_TIMINGS.dinner,
          items: ["Gobi Matar", "Potato 65", "Yellow dal", "Steam Rice", "Bisi Bele Bath (SI)", "Phulka", "Curd", "Appalam", "Mix veg pickle", "Buttermilk", "Sweetlime"]
        }
      }
    };

    const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    let todayName = DAYS[new Date().getDay()];
    let activeSelectedDay = todayName;
    let isTodayOnlyMode = true;

    // Highlights detection
    function formatFoodItem(item, nonVegList = []) {
      const lower = item.toLowerCase();
      const isNonVeg = nonVegList.some(nv => nv.toLowerCase() === lower);

      let highlightClass = "";
      let icon = "";

      if (lower.includes("watermelon")) {
        highlightClass = "highlight-watermelon";
        icon = "🍉 ";
      } else if (lower.includes("ice cream")) {
        highlightClass = "highlight-icecream";
        icon = "🍨 ";
      } else if (lower.includes("gulab jamun") || lower.includes("mysore pak") || lower.includes("kesari")) {
        highlightClass = "highlight-dessert";
        icon = "✨ ";
      }

      let extraBadge = isNonVeg ? `<span class="non-veg-badge">NV</span>` : "";

      if (highlightClass) {
        return `<span class="food-item ${highlightClass}">${icon}${item}${extraBadge}</span>`;
      }
      return `<span class="food-item">${item}${extraBadge}</span>`;
    }

    function renderDayMenu(day) {
      const data = WEEKLY_MENU[day];
      if (!data) return;

      const isToday = (day === todayName);

      // Update header
      const headerTitle = document.getElementById("cardHeaderTitle");
      const todayBadge = document.getElementById("cardTodayBadge");
      headerTitle.textContent = `📅 ${day.toUpperCase()} ${isToday ? "(TODAY)" : ""}`;
      todayBadge.style.display = isToday ? "inline-block" : "none";

      const tbody = document.getElementById("menuTableBody");
      tbody.innerHTML = "";

      const mealSlots = [
        { key: "breakfast", label: "BREAKFAST", slot: data.breakfast },
        { key: "lunch", label: "LUNCH", slot: data.lunch },
        { key: "snacks", label: "SNACKS", slot: data.snacks },
        { key: "dinner", label: "DINNER", slot: data.dinner }
      ];

      const currentActiveSlot = getCurrentlyActiveMealSlot();

      mealSlots.forEach((meal, idx) => {
        const tr = document.createElement("tr");
        if (isToday && meal.key === currentActiveSlot) {
          tr.classList.add("active-slot");
        }

        const itemsHTML = meal.slot.items
          .map(item => formatFoodItem(item, meal.slot.nonVeg || []))
          .join('<span class="food-item-separator">, </span>');

        tr.innerHTML = `
          <td>
            <div class="meal-tag-wrapper">
              <span class="meal-name">
                <span class="meal-tag-pill"></span>
                ${meal.label}
              </span>
              <span class="slot-timing-text">${meal.slot.timing}</span>
            </div>
          </td>
          <td>
            <div class="items-container">
              ${itemsHTML}
            </div>
          </td>
          <td class="col-timing">
            <span class="timing-badge">⏰ ${meal.slot.timing}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Update tabs active state
      document.querySelectorAll(".day-tab").forEach(tab => {
        tab.classList.toggle("active", tab.textContent.trim().startsWith(day));
        tab.classList.toggle("today-indicator", tab.textContent.trim().startsWith(todayName));
      });
    }

    function selectDay(day) {
      activeSelectedDay = day;
      renderDayMenu(day);
    }

    function toggleViewMode() {
      isTodayOnlyMode = !isTodayOnlyMode;
      const btn = document.getElementById("toggleModeBtn");
      const tabs = document.getElementById("dayTabsContainer");

      if (isTodayOnlyMode) {
        btn.classList.add("active");
        btn.querySelector("span").textContent = "[ SHOW TODAY'S MENU ONLY ]";
        tabs.style.display = "none";
        selectDay(todayName);
      } else {
        btn.classList.remove("active");
        btn.querySelector("span").textContent = "👁️ SHOWING ALL DAYS (SWITCH)";
        tabs.style.display = "flex";
      }
    }

    function getCurrentlyActiveMealSlot() {
      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();

      // Breakfast: 7:00 AM (420) – 9:30 AM (570)
      if (mins >= 420 && mins <= 570) return "breakfast";
      // Lunch: 12:00 PM (720) – 2:30 PM (870)
      if (mins >= 720 && mins <= 870) return "lunch";
      // Snacks: 4:30 PM (990) – 5:45 PM (1065)
      if (mins >= 990 && mins <= 1065) return "snacks";
      // Dinner: 7:00 PM (1140) – 9:45 PM (1305)
      if (mins >= 1140 && mins <= 1305) return "dinner";

      return null;
    }

    function updateLiveClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      document.getElementById("liveTime").textContent = `${todayName}, ${timeStr}`;

      const activeSlot = getCurrentlyActiveMealSlot();
      const statusEl = document.getElementById("currentMealStatus");
      const bannerEl = document.getElementById("nowServingText");

      if (activeSlot) {
        const title = activeSlot.toUpperCase();
        statusEl.textContent = `🟢 Now Serving: ${title}`;
        bannerEl.textContent = `🟢 Currently Serving ${title}`;
      } else {
        statusEl.textContent = `Kitchen in Preparation`;
        bannerEl.textContent = `Next Service Soon`;
      }
    }

    function copyMarkdown() {
      const data = WEEKLY_MENU[activeSelectedDay];
      const markdown = `### 📅 ${data.day.toUpperCase()} ${activeSelectedDay === todayName ? "(TODAY)" : ""}\n\n` +
        `| 🕒 MEAL | 🍴 ITEMS | ⏰ TIMINGS |\n` +
        `| :--- | :--- | :--- |\n` +
        `| **BREAKFAST** | ${data.breakfast.items.join(", ")} | ${data.breakfast.timing} |\n` +
        `| **LUNCH** | ${data.lunch.items.join(", ")} | ${data.lunch.timing} |\n` +
        `| **SNACKS** | ${data.snacks.items.join(", ")} | ${data.snacks.timing} |\n` +
        `| **DINNER** | ${data.dinner.items.join(", ")} | ${data.dinner.timing} |`;

      navigator.clipboard.writeText(markdown).then(() => {
        alert("Markdown table copied to clipboard!");
      });
    }

    // Init
    setInterval(updateLiveClock, 1000);
    updateLiveClock();
    renderDayMenu(todayName);
  </script>
</body>
</html>
